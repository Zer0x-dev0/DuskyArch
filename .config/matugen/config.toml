# =============================================================================
# 1. GTK, Qt & Core Theming
# =============================================================================

[templates.gtk3]
input_path  = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/matugen/generated/gtk-3.css'
post_hook   = '''
  # Live-reloadable THEME: the versioned adw-gtk3-matugen-* theme dir and the
  # gtk settings (settings.ini / xsettingsd / gsettings) are rebuilt in the
  # standalone_commands post_hook, which runs AFTER the papirus accent renders
  # (gtk3 renders before papirus, so the versioned name would be stale here).
  # The user css (~/.config/gtk-3.0/gtk.css) is only read at startup and would
  # mask the theme (priority 800 vs 400), so it must NOT be created.
  rm -f "$HOME/.config/gtk-3.0/gtk.css"
'''

[templates.gtk4]
input_path  = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/matugen/generated/gtk-4.css'
post_hook   = '''
  ln -nfs "$HOME/.config/matugen/generated/gtk-4.css" "$HOME/.config/gtk-4.0/gtk.css"
  ln -nfs "/usr/share/themes/adw-gtk3/gtk-4.0/libadwaita.css" "$HOME/.config/gtk-4.0/libadwaita.css"
  ln -nfs "/usr/share/themes/adw-gtk3/gtk-4.0/libadwaita-tweaks.css" "$HOME/.config/gtk-4.0/libadwaita-tweaks.css"
'''

[templates.icon_theme]
input_path  = '/dev/null'
output_path = '/dev/null'
post_hook   = '''
  gsettings set org.gnome.desktop.interface icon-theme "Papirus" || :
'''

[templates.papirus_icon_theme]
input_path  = '~/.config/matugen/templates/papirus'
output_path = '~/.config/matugen/generated/papirus'
post_hook   = '''
  "$HOME/user_scripts/gtk/papirus_folder_colors.sh" || :
'''

[templates.qt5ct]
input_path  = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/matugen/generated/qt5ct-colors.conf'

[templates.qt6ct]
input_path  = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/matugen/generated/qt6ct-colors.conf'

[templates.kvantum_kvconfig]
input_path  = '~/.config/matugen/templates/kvantum-colors.kvconfig'
output_path = '~/.config/matugen/generated/kvantum-matugen.kvconfig'
post_hook   = '''
  ln -nfs "$HOME/.config/matugen/generated/kvantum-matugen.kvconfig" "$HOME/.config/Kvantum/matugen/matugen.kvconfig"
'''

[templates.kvantum_svg]
input_path  = '~/.config/matugen/templates/kvantum-colors.svg'
output_path = '~/.config/matugen/generated/kvantum-matugen.svg'
post_hook   = '''
  ln -nfs "$HOME/.config/matugen/generated/kvantum-matugen.svg" "$HOME/.config/Kvantum/matugen/matugen.svg"
'''


# =============================================================================
# 2. System Components (Wayland, Bars, Notifications)
# =============================================================================

[templates.hyprland]
input_path  = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/matugen/generated/hyprland-colors.lua'
post_hook   = '''
  # Greenlight for the deferred wallpaper transition: theme_ctl's awww fade
  # waits for this file so the transition is still animating while every
  # open app repaints below (masks the reload flicker / "shake"). First
  # statement of the first hook so every reload after this point is masked.
  touch "${XDG_RUNTIME_DIR:-/tmp}/dusky-fade-go" 2>/dev/null || :
  hyprctl reload config-only || :
'''

[templates.theme_notify]
input_path  = '~/.config/matugen/templates/theme-notify.sh'
output_path = '~/.config/matugen/generated/theme-notify.sh'
post_hook   = '''
  # Palette popup defined right after the hyprland hook so it fires as soon as
  # matugen renders the first templates - it only needs generated/theme-notify.sh,
  # so it no longer waits for the GTK/cursor/terminal reloads further down.
  bash ~/.config/matugen/generated/theme-notify.sh || :
'''

[templates.hyprlock]
input_path  = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/matugen/generated/hyprlock-colors.conf'

[templates.waybar]
input_path  = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/waybar-colors.css'
post_hook   = '''
  pkill -USR2 -x waybar || :
'''

[templates.wlogout]
input_path  = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/wlogout-colors.css'

[templates.colors_css]
input_path  = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/colors.css'

[templates.mako]
input_path  = '~/.config/matugen/templates/mako.ini'
output_path = '~/.config/matugen/generated/mako-colors.ini'
post_hook   = '''
  makoctl reload || :
'''

[templates.rofi]
input_path  = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/matugen/generated/rofi-colors.rasi'

[templates.dusky_visualizer_colors]
input_path  = '~/.config/matugen/templates/dusky_visualizer_colors.json'
output_path = '~/.config/matugen/generated/dusky_visualizer_colors.json'


