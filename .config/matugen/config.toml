  touch "$HOME/.config/foot/foot.ini" || :
  pkill -SIGUSR1 -x foot || :
'''

[templates.khal]
input_path  = '~/.config/matugen/templates/khal.conf'
output_path = '~/.config/matugen/generated/khal-config'
post_hook   = 'ln -nfs "$HOME/.config/matugen/generated/khal-config" "$HOME/.config/khal/config"'

[templates.zellij]
enabled     = true
input_path  = '~/.config/matugen/templates/zellij.kdl'
output_path = '~/.config/matugen/generated/zellij.kdl'
post_hook   = '''
  ln -nfs "$HOME/.config/matugen/generated/zellij.kdl" "$HOME/.config/zellij/themes/matugen.kdl"
  touch "$HOME/.config/zellij/config.kdl" || :
'''

[templates.opencode]
input_path  = '~/.config/matugen/templates/opencode-colors.json'
output_path = '~/.config/matugen/generated/opencode.json'
post_hook   = '''
  ln -nfs "$HOME/.config/matugen/generated/opencode.json" "$HOME/.config/opencode/themes/matugen.json"
  pkill -SIGUSR1 -x kitty || :
'''

[templates.nuclear]
input_path  = '~/.config/matugen/templates/nuclear-theme.json'
output_path = '~/.config/matugen/generated/nuclear-theme.json'
post_hook   = '''
  # Nuclear is a flatpak (aarch64: no AUR/native builds), so its theme dir is
  # under the sandboxed ~/.var/app. Plain copy: a symlink would point outside
  # the app's granted filesystem view and fail inside the sandbox.
  # Run in background to avoid blocking matugen (theme applies async but faster UX)
  ( cp -f "$HOME/.config/matugen/generated/nuclear-theme.json" \
         "$HOME/.var/app/com.nuclearplayer.Nuclear/data/com.nuclearplayer/themes/dusky.json" ) &
'''

