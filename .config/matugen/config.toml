[templates.hyprcursor]
input_path  = '/dev/null'
output_path = '/dev/null'
post_hook   = '''
  # Cursor recolor is the slowest hook (SVG -> .hlc/xcursor compile) and is
  # independent of every other reload: run it in the background so the popup,
  # GTK and terminal hooks below never wait on it. cursor_recolor.sh is
  # guarded by a flock + color stamp, so a queued run from a rapid second
  # theme change just exits (newest colors win).
  ( CURSOR_PRIMARY="{{colors.primary.default.hex}}" \
    CURSOR_OUTLINE="{{colors.outline.default.hex}}" \
    CURSOR_ERROR="{{colors.error.default.hex}}" \
    CURSOR_TERTIARY="{{colors.tertiary.default.hex}}" \
    CURSOR_SECONDARY="{{colors.secondary.default.hex}}" \
    CURSOR_SECONDARY_CONTAINER="{{colors.secondary_container.default.hex}}" \
    CURSOR_ON_SURFACE="{{colors.on_surface.default.hex}}" \
    CURSOR_ON_SURFACE_VARIANT="{{colors.on_surface_variant.default.hex}}" \
    CURSOR_ON_PRIMARY_CONTAINER="{{colors.on_primary_container.default.hex}}" \
    bash "$HOME/user_scripts/theme_matugen/cursor_recolor.sh" ) &
'''


# =============================================================================
# 5. Standalone Commands & Final Hooks
# =============================================================================
# You can easily drop any miscellaneous bash scripts or commands you want to 
# run on a theme reload into the block below.

[templates.standalone_commands]
input_path  = '/dev/null'
output_path = '/dev/null'
post_hook   = '''
  # ADD YOUR CUSTOM COMMANDS HERE:
  # Examples:
  # echo "Matugen ran successfully" > /tmp/matugen_status.txt
  # bash $HOME/scripts/some_other_theme_script.sh

  # --- GTK3/GTK4 live theme: single source of truth -------------------------
  # This hook runs LAST, after every template rendered, so generated/papirus
  # and gtk-3.css are fresh. It builds a versioned adw-gtk3-matugen-* theme
  # dir and points settings.ini + xsettingsd at it for apps that read those
  # files. The gsettings sets below apply the theme LIVE to running GTK apps
  # (verified on Wayland with grim pixel analysis: no restart needed).
  NAME="adw-gtk3-matugen-$(sed -n '1s/^#//p' "$HOME/.config/matugen/generated/papirus" 2>/dev/null)"
  if [[ -z "$NAME" || "$NAME" == "adw-gtk3-matugen-" ]]; then
    NAME="adw-gtk3-matugen-$(sed -n 's/^@define-color accent_color #//p' "$HOME/.config/matugen/generated/gtk-3.css" 2>/dev/null | head -1)"
  fi
  if [[ -n "$NAME" && "$NAME" != "adw-gtk3-matugen-" ]]; then
    mkdir -p "$HOME/.local/share/themes/$NAME/gtk-3.0"
    [[ -f "$HOME/.local/share/themes/$NAME/index.theme" ]] || \
      cp /usr/share/themes/adw-gtk3/index.theme "$HOME/.local/share/themes/$NAME/" 2>/dev/null || :
    cat /usr/share/themes/adw-gtk3/gtk-3.0/gtk.css \
        "$HOME/.config/matugen/generated/gtk-3.css" \
        > "$HOME/.local/share/themes/$NAME/gtk-3.0/gtk.css" 2>/dev/null || :
    find "$HOME/.local/share/themes" -maxdepth 1 -type d \
         -name 'adw-gtk3-matugen-*' ! -name "$NAME" \
         -exec rm -rf {} + 2>/dev/null || :

    for ini in "$HOME/.config/gtk-3.0/settings.ini" "$HOME/.config/gtk-4.0/settings.ini"; do
      [[ -f "$ini" ]] || continue
      sed -i "s/^gtk-theme-name=.*/gtk-theme-name=$NAME/" "$ini"
      sed -i "s/^gtk-icon-theme-name=.*/gtk-icon-theme-name=Papirus/" "$ini"
    done
    XS="$HOME/.config/xsettingsd/xsettingsd.conf"
    if [[ -f "$XS" ]]; then
      sed -i "s@^Net/ThemeName .*@Net/ThemeName \"$NAME\"@" "$XS"
      sed -i "s@^Net/IconThemeName .*@Net/IconThemeName \"Papirus\"@" "$XS"
    fi
  fi

  # Force running GTK apps to re-read the freshly generated CSS and icons
  # without a restart. Same value twice is a no-op, so the gtk-theme name is
  # versioned by the source color and icons bounce through a real installed
  # theme ('Adwaita') to invalidate the process-local caches. The icon
  # bounce MUST pause between the two sets: two rapid gsettings writes are
  # coalesced by GTK into a single no-op, and file managers like Thunar
  # would keep rendering the old folder colors (verified live via grim).
  # The bounce is async: the 0.5s pause is required, but nothing may wait on it.
  gsettings set org.gnome.desktop.interface gtk-theme "$NAME" 2>/dev/null || :
  ( gsettings set org.gnome.desktop.interface icon-theme 'Adwaita' 2>/dev/null || :
    sleep 0.5
    gsettings set org.gnome.desktop.interface icon-theme 'Papirus' 2>/dev/null || : ) &
'''
