# --- Glass mode (themed per wallpaper) ---------------------------------
# Applies on every theme run (kitty SIGUSR1 reload re-reads this file).
# Requires the compositor's blur (Hyprland blur is enabled). Tune at
# runtime: ctrl+shift+n/m (increase/decrease), ctrl+shift+d (reset).
# Lower background_blur on weak GPUs (e.g. virtio/virgl).
background_opacity 0.8
background_blur 30
