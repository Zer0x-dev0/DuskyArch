[General]
# Background image (relative to theme dir, or absolute path)
background=wallpaper.jpg

# Blur layer opacity: 0.0 = disabled, 1.0 = fully blurred backdrop
blurOpacity=0.85

# Blur radius in texels
blurRadius=18.0

# Saturation boost for the "vibrant" blur (1.0 = normal)
saturation=1.28

# UI colors (hex)
accentColor=#9dcbfb
textColor=#e8f2ff
mutedColor=#9fb4cc

# Fonts
fontFamily=JetBrainsMono Nerd Font
